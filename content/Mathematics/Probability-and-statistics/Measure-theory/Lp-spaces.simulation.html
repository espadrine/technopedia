<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lp-spaces simulation</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #1a1a2e; color: #eee; }
h2 { margin: 0 0 8px 0; font-size: 1.1em; color: #7ec8e3; }
.panel { margin-bottom: 24px; }
canvas { background: #16213e; border-radius: 8px; display: block; }
.controls { margin-top: 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
label { font-size: 0.9em; }
input[type=range] { width: 160px; }
.btn { background: #0f3460; color: #eee; border: 1px solid #533483; border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 0.85em; }
.btn:hover { background: #533483; }
.info { font-size: 0.85em; color: #aaa; margin-top: 4px; }
</style>
</head>
<body>

<div class="panel">
<h2>‖f‖<sub>p</sub> for f(x) = x<sup>−1/3</sup> on (0,1)</h2>
<canvas id="normPlot" width="600" height="300"></canvas>
<div class="controls">
<label>p = <span id="pVal">1.5</span></label>
<input type="range" id="pSlider" min="1" max="2.99" step="0.01" value="1.5">
<span class="info">The norm diverges as p → 3⁻. f ∈ L<sup>p</sup> iff 1 ≤ p &lt; 3.</span>
</div>
</div>

<div class="panel">
<h2>Mass concentrating: f<sub>n</sub> = n · 1<sub>(0, 1/n)</sub> on (0,1)</h2>
<canvas id="massPlot" width="600" height="250"></canvas>
<div class="controls">
<button class="btn" id="playBtn">▶ Play</button>
<button class="btn" id="resetBtn">Reset</button>
<label>n = <span id="nVal">5</span></label>
<span class="info">f<sub>n</sub> → 0 a.e. but ‖f<sub>n</sub>‖<sub>1</sub> = 1 for all n. The mass concentrates near 0.</span>
</div>
</div>

<script>
// --- Panel 1: Norm plot ---
(function(){
  var cv = document.getElementById('normPlot');
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var pad = {l:50, r:20, t:20, b:40};
  var pMin = 1, pMax = 3;
  var normMax = 10;

  function normAt(p) {
    if (p >= 3) return Infinity;
    return Math.pow(3/(3-p), 1/p);
  }

  function draw() {
    var p = parseFloat(document.getElementById('pSlider').value);
    document.getElementById('pVal').textContent = p.toFixed(2);
    ctx.clearRect(0,0,W,H);

    // Axes
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.l, pad.t);
    ctx.lineTo(pad.l, H-pad.b);
    ctx.lineTo(W-pad.r, H-pad.b);
    ctx.stroke();

    // Axis labels
    ctx.fillStyle = '#aaa';
    ctx.font = '12px system-ui';
    ctx.textAlign = 'center';
    for (var i = 1; i <= 3; i++) {
      var x = pad.l + (i - pMin)/(pMax - pMin) * (W - pad.l - pad.r);
      ctx.fillText(i.toString(), x, H - pad.b + 16);
    }
    ctx.fillText('p', (pad.l + W - pad.r)/2, H - 6);

    ctx.textAlign = 'right';
    for (var j = 0; j <= normMax; j += 2) {
      var y = H - pad.b - j/normMax * (H - pad.t - pad.b);
      ctx.fillText(j.toString(), pad.l - 6, y + 4);
    }
    ctx.save();
    ctx.translate(14, (pad.t + H - pad.b)/2);
    ctx.rotate(-Math.PI/2);
    ctx.textAlign = 'center';
    ctx.fillText('‖f‖ₚ', 0, 0);
    ctx.restore();

    // Vertical line at p=3
    var x3 = pad.l + (3 - pMin)/(pMax - pMin) * (W - pad.l - pad.r);
    ctx.strokeStyle = '#e74c3c';
    ctx.setLineDash([5,3]);
    ctx.beginPath();
    ctx.moveTo(x3, pad.t);
    ctx.lineTo(x3, H-pad.b);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#e74c3c';
    ctx.textAlign = 'center';
    ctx.fillText('p = 3 (diverges)', x3, pad.t + 12);

    // Plot the curve
    ctx.strokeStyle = '#7ec8e3';
    ctx.lineWidth = 2;
    ctx.beginPath();
    var started = false;
    for (var px = 0; px <= 200; px++) {
      var pp = pMin + px/200 * (pMax - pMin);
      var nv = normAt(pp);
      if (nv > normMax) break;
      var x = pad.l + (pp - pMin)/(pMax - pMin) * (W - pad.l - pad.r);
      var y = H - pad.b - nv/normMax * (H - pad.t - pad.b);
      if (!started) { ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Marker at current p
    var nv = normAt(p);
    if (nv <= normMax) {
      var mx = pad.l + (p - pMin)/(pMax - pMin) * (W - pad.l - pad.r);
      var my = H - pad.b - nv/normMax * (H - pad.t - pad.b);
      ctx.fillStyle = '#f39c12';
      ctx.beginPath();
      ctx.arc(mx, my, 5, 0, 2*Math.PI);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'left';
      ctx.fillText('‖f‖ₚ = ' + nv.toFixed(3), mx + 8, my - 8);
    }
  }

  document.getElementById('pSlider').addEventListener('input', draw);
  draw();
})();

// --- Panel 2: Mass concentrating ---
(function(){
  var cv = document.getElementById('massPlot');
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var pad = {l:40, r:20, t:20, b:30};
  var n = 5;
  var playing = false;
  var animId = null;

  function draw() {
    document.getElementById('nVal').textContent = n;
    ctx.clearRect(0,0,W,H);

    // Axes
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.l, pad.t);
    ctx.lineTo(pad.l, H-pad.b);
    ctx.lineTo(W-pad.r, H-pad.b);
    ctx.stroke();

    // Labels
    ctx.fillStyle = '#aaa';
    ctx.font = '11px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('0', pad.l, H-pad.b+14);
    ctx.fillText('1', W-pad.r, H-pad.b+14);
    ctx.fillText('x', (pad.l+W-pad.r)/2, H-4);

    var maxH = Math.min(n, 20);
    // y-axis label
    ctx.textAlign = 'right';
    ctx.fillText(maxH.toString(), pad.l-4, pad.t+8);
    ctx.fillText('0', pad.l-4, H-pad.b+4);

    // Draw f_n = n * 1_{(0, 1/n)}
    var barW = (1/n) / 1 * (W - pad.l - pad.r);
    var barH = n / maxH * (H - pad.t - pad.b);
    ctx.fillStyle = 'rgba(126, 200, 227, 0.6)';
    ctx.strokeStyle = '#7ec8e3';
    ctx.lineWidth = 1.5;
    ctx.fillRect(pad.l, H - pad.b - barH, barW, barH);
    ctx.strokeRect(pad.l, H - pad.b - barH, barW, barH);

    // Label the bar
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.font = '11px system-ui';
    var labelX = pad.l + barW/2;
    var labelY = H - pad.b - barH - 6;
    if (labelY < pad.t + 10) labelY = pad.t + 10;
    ctx.fillText('height = ' + n, labelX + 4, labelY);
    ctx.fillText('width = 1/' + n, labelX + 4, labelY + 13);

    // Show integral annotation
    ctx.fillStyle = '#f39c12';
    ctx.font = '12px system-ui';
    ctx.textAlign = 'left';
    ctx.fillText('∫₀¹ fₙ dx = ' + n + ' × (1/' + n + ') = 1', pad.l + 10, H - pad.b - 10);

    // Show a.e. convergence annotation
    ctx.fillStyle = '#aaa';
    ctx.font = '11px system-ui';
    ctx.fillText('fₙ(x) → 0 for every x > 0, but ‖fₙ‖₁ = 1 ∀n', pad.l + 10, pad.t + 12);
  }

  function step() {
    if (n < 50) { n++; draw(); }
    else { stop(); }
  }

  function play() {
    if (playing) return;
    playing = true;
    document.getElementById('playBtn').textContent = '⏸ Pause';
    animId = setInterval(step, 200);
  }

  function stop() {
    playing = false;
    document.getElementById('playBtn').textContent = '▶ Play';
    if (animId) { clearInterval(animId); animId = null; }
  }

  document.getElementById('playBtn').addEventListener('click', function(){
    if (playing) stop(); else play();
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    stop(); n = 5; draw();
  });

  draw();
})();
</script>
</body>
</html>
