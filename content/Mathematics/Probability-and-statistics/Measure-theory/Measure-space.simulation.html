<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sigma-algebra closure checker</title>
<style>
body { font-family: system-ui, sans-serif; margin: 20px; background: #1a1a2e; color: #eee; }
h2 { color: #64b5f6; margin-bottom: 10px; }
.set-display { font-size: 1.2em; margin: 10px 0; padding: 10px; background: #16213e; border-radius: 8px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 15px 0; }
.subset { padding: 8px; text-align: center; border-radius: 6px; cursor: pointer; user-select: none; transition: all 0.2s; border: 2px solid #333; background: #0f3460; font-size: 0.9em; }
.subset.selected { background: #1a5276; border-color: #64b5f6; }
.subset:hover { border-color: #90caf9; }
.results { margin-top: 15px; }
.axiom { padding: 10px; margin: 8px 0; border-radius: 6px; border-left: 4px solid #4caf50; background: #1b2a4a; }
.axiom.fail { border-left-color: #f44336; background: #2d1b1b; }
.axiom .label { font-weight: bold; }
.axiom .detail { font-size: 0.85em; color: #aaa; margin-top: 4px; }
.axiom.fail .detail { color: #ff8a80; }
.status { font-size: 1.1em; margin: 10px 0; padding: 10px; border-radius: 6px; text-align: center; }
.status.pass { background: #1b3a2a; color: #69f0ae; }
.status.fail { background: #3a1b1b; color: #ff5252; }
.hint { font-size: 0.85em; color: #888; margin-top: 10px; }
</style>
</head>
<body>
<h2>Sigma-algebra closure checker</h2>
<div class="set-display">Universe: <b>X = {1, 2, 3, 4}</b></div>
<p>Toggle subsets to build a collection. The checker verifies the three sigma-algebra axioms in real time.</p>
<div class="grid" id="grid"></div>
<div class="status" id="status"></div>
<div class="results" id="results"></div>
<p class="hint">Tip: The trivial sigma-algebra {&empty;, X} and the power set &wp;(X) are always valid. Try building the sigma-algebra generated by {1}.</p>
<script>
var X = [1,2,3,4];
var allSubsets = [];
for (var mask = 0; mask < 16; mask++) {
  var s = new Set();
  for (var i = 0; i < 4; i++) if (mask & (1 << i)) s.add(X[i]);
  allSubsets.push(s);
}
function setKey(s) { return Array.from(s).sort(function(a,b){return a-b;}).join(','); }
function setStr(s) { return s.size === 0 ? '&empty;' : '{' + Array.from(s).join(',') + '}'; }
function complement(s) { var c = new Set(); X.forEach(function(x){ if(!s.has(x)) c.add(x); }); return c; }
function union(a, b) { var u = new Set(a); b.forEach(function(x){ u.add(x); }); return u; }

var selected = new Set([setKey(new Set()), setKey(new Set(X))]);

var grid = document.getElementById('grid');
allSubsets.forEach(function(s) {
  var key = setKey(s);
  var div = document.createElement('div');
  div.className = 'subset' + (selected.has(key) ? ' selected' : '');
  div.textContent = setStr(s);
  div.onclick = function() {
    if (selected.has(key)) selected.delete(key); else selected.add(key);
    div.className = 'subset' + (selected.has(key) ? ' selected' : '');
    check();
  };
  grid.appendChild(div);
});

function check() {
  var selSets = allSubsets.filter(function(s){ return selected.has(setKey(s)); });
  var selKeys = new Set(selSets.map(setKey));

  var a1 = selKeys.has(setKey(new Set(X)));

  var a2 = true;
  var a2viol = [];
  selSets.forEach(function(s) {
    var c = complement(s);
    if (!selKeys.has(setKey(c))) { a2 = false; a2viol.push(setStr(s) + ' &rarr; ' + setStr(c)); }
  });

  var a3 = true;
  var a3viol = [];
  for (var i = 0; i < selSets.length; i++) {
    for (var j = i+1; j < selSets.length; j++) {
      var u = union(selSets[i], selSets[j]);
      if (!selKeys.has(setKey(u))) { a3 = false; a3viol.push(setStr(selSets[i]) + ' &cup; ' + setStr(selSets[j]) + ' = ' + setStr(u)); }
    }
  }

  var pass = a1 && a2 && a3;
  var status = document.getElementById('status');
  status.className = 'status ' + (pass ? 'pass' : 'fail');
  status.textContent = pass ? '\u2713 This is a valid sigma-algebra' : '\u2717 Not a sigma-algebra';

  var results = document.getElementById('results');
  var html = '';

  var d1 = a1 ? 'X is in the collection.' : 'X is missing from the collection.';
  html += '<div class="axiom ' + (a1?'':'fail') + '"><span class="label">Axiom 1: X &isin; &F;</span><div class="detail">' + d1 + '</div></div>';

  var d2 = a2 ? 'All complements are present.' : 'Missing complements: ' + a2viol.slice(0,3).join('; ') + (a2viol.length > 3 ? ' &hellip;' : '');
  html += '<div class="axiom ' + (a2?'':'fail') + '"><span class="label">Axiom 2: Closed under complement</span><div class="detail">' + d2 + '</div></div>';

  var d3 = a3 ? 'All pairwise unions are present (finite set &rArr; countable = finite).' : 'Missing unions: ' + a3viol.slice(0,3).join('; ') + (a3viol.length > 3 ? ' &hellip;' : '');
  html += '<div class="axiom ' + (a3?'':'fail') + '"><span class="label">Axiom 3: Closed under countable unions</span><div class="detail">' + d3 + '</div></div>';

  results.innerHTML = html;
}

check();
</script>
</body>
</html>
