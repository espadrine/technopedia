<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quorum Intersection Simulation</title>
<style>
body { font-family: system-ui, sans-serif; margin: 20px; background: #1a1a2e; color: #eee; }
h2 { color: #7ec8e3; margin-bottom: 4px; }
.subtitle { color: #aaa; font-size: 14px; margin-bottom: 16px; }
.nodes { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.node { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; cursor: pointer; border: 3px solid #555; transition: all 0.3s; user-select: none; }
.node.alive { background: #2d6a4f; border-color: #52b788; color: #fff; }
.node.dead { background: #3d0000; border-color: #e63946; color: #e63946; text-decoration: line-through; }
.node:hover { transform: scale(1.1); }
.info { background: #16213e; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.info h3 { margin: 0 0 8px 0; color: #7ec8e3; font-size: 15px; }
.info p { margin: 4px 0; font-size: 14px; }
.status { font-weight: bold; }
.ok { color: #52b788; }
.fail { color: #e63946; }
.quorum-viz { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.q-node { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
.q-node.in { background: #2d6a4f; color: #fff; }
.q-node.out { background: #333; color: #666; }
.q-node.intersect { background: #f4a261; color: #000; }
.controls { margin-top: 12px; }
.controls label { font-size: 13px; color: #aaa; margin-right: 8px; }
.controls select { background: #16213e; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; }
.legend { display: flex; gap: 16px; margin-top: 12px; font-size: 12px; color: #aaa; }
.legend span { display: flex; align-items: center; gap: 4px; }
.legend .dot { width: 12px; height: 12px; border-radius: 50%; }
</style>
</head>
<body>
<h2>Quorum Intersection</h2>
<p class="subtitle">Click nodes to toggle alive/dead. Observe whether writes and reads can still proceed.</p>

<div class="controls">
<label>Nodes (n):</label>
<select id="nSelect">
<option value="3">3</option>
<option value="5" selected>5</option>
<option value="7">7</option>
</select>
<label>Quorum (q):</label>
<select id="qSelect"></select>
</div>

<div class="nodes" id="nodes"></div>

<div class="info">
<h3>Write quorum (need q alive nodes to commit)</h3>
<p id="writeStatus"></p>
<div class="quorum-viz" id="writeQuorum"></div>
</div>

<div class="info">
<h3>Read quorum (need q alive nodes to read)</h3>
<p id="readStatus"></p>
<div class="quorum-viz" id="readQuorum"></div>
</div>

<div class="info">
<h3>Quorum intersection guarantee</h3>
<p id="intersectStatus"></p>
<div class="legend">
<span><span class="dot" style="background:#2d6a4f"></span> In quorum</span>
<span><span class="dot" style="background:#f4a261"></span> Intersection (has latest data)</span>
<span><span class="dot" style="background:#333"></span> Not in quorum</span>
</div>
</div>

<script>
let n = 5, q = 3;
let alive = [true, true, true, true, true];

function init() {
  n = parseInt(document.getElementById('nSelect').value);
  const minQ = Math.floor(n / 2) + 1;
  const qSel = document.getElementById('qSelect');
  qSel.innerHTML = '';
  for (let i = minQ; i <= n; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i + (i === minQ ? ' (majority)' : '');
    if (i === minQ) opt.selected = true;
    qSel.appendChild(opt);
  }
  q = minQ;
  alive = Array(n).fill(true);
  render();
}

document.getElementById('nSelect').addEventListener('change', init);
document.getElementById('qSelect').addEventListener('change', function() { q = parseInt(this.value); render(); });

function render() {
  const nodesDiv = document.getElementById('nodes');
  nodesDiv.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const div = document.createElement('div');
    div.className = 'node ' + (alive[i] ? 'alive' : 'dead');
    div.textContent = String.fromCharCode(65 + i);
    div.onclick = () => { alive[i] = !alive[i]; render(); };
    nodesDiv.appendChild(div);
  }

  const aliveCount = alive.filter(a => a).length;
  const canWrite = aliveCount >= q;
  const canRead = aliveCount >= q;

  document.getElementById('writeStatus').innerHTML = canWrite
    ? '<span class="status ok">✓ ' + aliveCount + ' alive ≥ ' + q + ' quorum → writes can proceed</span>'
    : '<span class="status fail">✗ ' + aliveCount + ' alive < ' + q + ' quorum → writes BLOCKED</span>';

  document.getElementById('readStatus').innerHTML = canRead
    ? '<span class="status ok">✓ ' + aliveCount + ' alive ≥ ' + q + ' quorum → reads can proceed</span>'
    : '<span class="status fail">✗ ' + aliveCount + ' alive < ' + q + ' quorum → reads BLOCKED</span>';

  const aliveIdx = [];
  for (let i = 0; i < n; i++) if (alive[i]) aliveIdx.push(i);

  const writeQ = aliveIdx.slice(0, Math.min(q, aliveIdx.length));
  const readQ = aliveIdx.slice(Math.max(0, aliveIdx.length - q), aliveIdx.length);
  const intersection = writeQ.filter(x => readQ.includes(x));

  renderQuorum('writeQuorum', n, writeQ, intersection);
  renderQuorum('readQuorum', n, readQ, intersection);

  if (canWrite && canRead) {
    document.getElementById('intersectStatus').innerHTML =
      'Any two quorums of ' + n + ' nodes with q=' + q + ' intersect in at least ' + (2 * q - n) + ' node(s). ' +
      'The intersection node(s) hold the latest committed value, so readers always see the most recent write.';
  } else {
    document.getElementById('intersectStatus').innerHTML =
      'Not enough alive nodes to form a quorum. The system is unavailable until nodes recover.';
  }
}

function renderQuorum(id, n, quorum, intersection) {
  const div = document.getElementById(id);
  div.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'q-node ' + (quorum.includes(i) ? (intersection.includes(i) ? 'intersect' : 'in') : 'out');
    el.textContent = String.fromCharCode(65 + i);
    div.appendChild(el);
  }
}

init();
</script>
</body>
</html>
