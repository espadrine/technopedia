<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Central limit theorem: histogram of sample means</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 8px; background: #fff; font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 6px; }
  canvas { display: block; width: 100%; height: 260px; border: 1px solid #ccc; background: #fafafa; }
  button { font-size: 13px; padding: 4px 10px; cursor: pointer; }
  #info { color: #444; }
</style>
</head>
<body>
<div class="controls">
  <label>Distribution:
    <select id="dist">
      <option value="uniform">Uniform(0,1)</option>
      <option value="exponential">Exponential(1)</option>
    </select>
  </label>
  <label>Sample size n: <span id="nval">30</span>
    <input type="range" id="n" min="1" max="500" value="30">
  </label>
  <button id="add">Add 1000 sample means</button>
  <button id="reset">Reset</button>
  <span id="count"></span>
</div>
<canvas id="cv"></canvas>
<p id="info">Each sample mean is the average of n i.i.d. draws. However non-normal the parent distribution is, the histogram of sample means converges to a normal curve (red).</p>
<script>
(function () {
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var means = [];
  var dist = document.getElementById('dist');
  var nInput = document.getElementById('n');
  var nval = document.getElementById('nval');
  var count = document.getElementById('count');

  // True parameters of the parent distributions.
  function params() {
    if (dist.value === 'uniform') return { mu: 0.5, sigma2: 1/12 };
    return { mu: 1, sigma2: 1 }; // Exponential(1)
  }

  function drawOne() {
    var n = +nInput.value, p = params(), sum = 0;
    for (var i = 0; i < n; i++) {
      if (dist.value === 'uniform') sum += Math.random();
      else sum += -Math.log(1 - Math.random()); // Exponential(1)
    }
    return sum / n;
  }

  function addBatch() {
    for (var k = 0; k < 1000; k++) means.push(drawOne());
    render();
  }

  function render() {
    var W = cv.width = cv.clientWidth * (window.devicePixelRatio || 1);
    var H = cv.height = 260 * (window.devicePixelRatio || 1);
    ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
    var w = cv.clientWidth, h = 260;
    ctx.clearRect(0, 0, w, h);
    var p = params();
    var n = +nInput.value;
    var sd = Math.sqrt(p.sigma2 / n);
    var lo = p.mu - 4 * sd, hi = p.mu + 4 * sd;
    var bins = 40, counts = new Array(bins).fill(0);
    var maxC = 0;
    for (var i = 0; i < means.length; i++) {
      var m = means[i];
      if (m < lo || m > hi) continue;
      var b = Math.min(bins - 1, Math.floor((m - lo) / (hi - lo) * bins));
      counts[b]++;
      if (counts[b] > maxC) maxC = counts[b];
    }
    var bw = w / bins;
    ctx.fillStyle = '#7aa6d6';
    for (var b2 = 0; b2 < bins; b2++) {
      if (!counts[b2]) continue;
      var bh = counts[b2] / maxC * (h - 30);
      ctx.fillRect(b2 * bw, h - bh - 5, bw - 1, bh);
    }
    // Theoretical normal density N(mu, sigma2/n), scaled to the histogram.
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    var scale = maxC * (h - 30) / (h - 30); // peak of histogram
    var normPeak = 1 / (sd * Math.sqrt(2 * Math.PI));
    for (var x = 0; x <= w; x += 2) {
      var xv = lo + (x / w) * (hi - lo);
      var yv = Math.exp(-((xv - p.mu) * (xv - p.mu)) / (2 * sd * sd)) / (sd * Math.sqrt(2 * Math.PI));
      var y = h - (yv / normPeak) * (h - 30) - 5;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    count.textContent = means.length + ' sample means collected';
  }

  document.getElementById('add').addEventListener('click', addBatch);
  document.getElementById('reset').addEventListener('click', function () { means = []; render(); });
  nInput.addEventListener('input', function () { nval.textContent = nInput.value; means = []; render(); });
  dist.addEventListener('change', function () { means = []; render(); });
  window.addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
