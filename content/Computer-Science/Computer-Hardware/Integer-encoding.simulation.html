<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Integer encoding: two's complement and overflow</title>
<style>
body { font-family: system-ui, sans-serif; margin: 20px; background: #fafafa; }
h1 { font-size: 1.25em; }
.controls { margin: 10px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls button { padding: 5px 14px; cursor: pointer; background: #1565c0; color: #fff; border: none; border-radius: 4px; }
.controls button:hover { background: #0d47a1; }
.bits-row { display: flex; flex-wrap: wrap; gap: 2px; margin: 6px 0; }
.bit { width: 18px; height: 24px; display: flex; align-items: center; justify-content: center; border: 1px solid #999; border-radius: 3px; font-size: 10px; font-family: monospace; background: #fff; cursor: pointer; }
.bit.set { background: #1565c0; color: #fff; }
.bit.sign { border: 2px solid #c62828; }
.bit-label { font-size: 0.8em; color: #555; }
.result { font-size: 0.95em; margin-top: 8px; font-family: monospace; }
.overflow { color: #c62828; font-weight: bold; }
.info { font-size: 0.85em; color: #555; margin-top: 6px; }
</style>
</head>
<body>
<h1>32-bit integer encoding (two's complement)</h1>
<p class="info">Click bits to toggle them, or use the buttons to add/subtract. Watch what happens at the boundary 0x7FFFFFFF → 0x80000000.</p>
<div class="bit-label">bit 31 (sign)</div>
<div class="bits-row" id="bits"></div>
<div class="controls">
<button onclick="bump(1)">+1</button>
<button onclick="bump(-1)">−1</button>
<button onclick="bump(16)">+16</button>
<button onclick="bump(-16)">−16</button>
<button onclick="setVal(0x7fffffff)">max int (0x7FFFFFFF)</button>
<button onclick="setVal(0)">Reset (0)</button>
</div>
<div class="result" id="result"></div>
<div class="info" id="ovf"></div>
<script>
let val = 0;
function render() {
  const bits = document.getElementById('bits');
  let h = '';
  for (let i = 31; i >= 0; i--) {
    const b = (val >>> i) & 1;
    h += `<div class="bit ${b ? 'set' : ''} ${i === 31 ? 'sign' : ''}" onclick="toggleBit(${i})">${b}</div>`;
  }
  bits.innerHTML = h;
  const unsigned = val >>> 0;
  const signed = val | 0;
  const hex = '0x' + unsigned.toString(16).toUpperCase().padStart(8, '0');
  document.getElementById('result').textContent =
    `hex ${hex}   |   unsigned ${unsigned}   |   signed (two's complement) ${signed}`;
  const prev = render.prev >>> 0, cur = unsigned;
  const overflowed = (prev < 0x80000000 && cur >= 0x80000000) || (prev >= 0x80000000 && cur < 0x80000000);
  document.getElementById('ovf').innerHTML = overflowed
    ? `<span class="overflow">Signed overflow! The sign bit flipped across the boundary — OF flag set, result wraps.</span> (As unsigned it is still fine: ${cur}.)`
    : '';
  render.prev = val;
}
function toggleBit(i) { val = (val ^ (1 << i)) >>> 0; render(); }
function bump(d) { val = (val + d) >>> 0; render(); }
function setVal(v) { val = v >>> 0; render(); }
render();
</script>
</body>
</html>
