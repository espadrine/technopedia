<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memory Allocator Visualization</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
h1 { font-size: 1.3em; margin-bottom: 12px; color: #fff; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
.controls label { font-size: 0.85em; }
.controls select, .controls button { padding: 6px 12px; border-radius: 4px; border: 1px solid #444; background: #2a2a4a; color: #e0e0e0; font-size: 0.85em; cursor: pointer; }
.controls button:hover { background: #3a3a6a; }
.controls button.active { background: #4a6fa5; border-color: #6a9fd8; }
#heap { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 16px; min-height: 40px; padding: 8px; background: #111; border-radius: 6px; border: 1px solid #333; }
.block { height: 36px; display: flex; align-items: center; justify-content: center; font-size: 0.65em; border-radius: 3px; color: #fff; font-weight: 600; min-width: 20px; transition: all 0.3s; }
.block.free { background: #2d5a27; }
.block.alloc { background: #2a4a7a; }
.block.fragmented { background: #7a5a1a; }
.block.buddy { background: #5a2a7a; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat { background: #222; padding: 10px; border-radius: 6px; border: 1px solid #333; }
.stat .label { font-size: 0.75em; color: #999; }
.stat .value { font-size: 1.1em; font-weight: 700; color: #fff; }
.legend { display: flex; gap: 16px; margin-bottom: 12px; font-size: 0.8em; }
.legend span { display: flex; align-items: center; gap: 5px; }
.legend .swatch { width: 14px; height: 14px; border-radius: 3px; }
#log { font-size: 0.75em; color: #aaa; max-height: 80px; overflow-y: auto; background: #111; padding: 8px; border-radius: 4px; border: 1px solid #333; }
#log div { margin-bottom: 2px; }
</style>
</head>
<body>
<h1>Memory Allocator Visualization</h1>
<div class="controls">
<label>Allocator:</label>
<select id="algo">
<option value="firstfit">First Fit</option>
<option value="bestfit">Best Fit</option>
<option value="buddy">Buddy</option>
</select>
<button id="btnAlloc">Allocate</button>
<button id="btnFree">Free</button>
<button id="btnRandom">Random 10</button>
<button id="btnReset">Reset</button>
<label>Size: <input type="number" id="size" value="64" min="16" max="512" step="16" style="width:60px;padding:4px;border-radius:3px;border:1px solid #444;background:#2a2a4a;color:#e0e0e0;"></label>
</div>
<div class="legend">
<span><span class="swatch" style="background:#2d5a27"></span> Free</span>
<span><span class="swatch" style="background:#2a4a7a"></span> Allocated</span>
<span><span class="swatch" style="background:#7a5a1a"></span> Fragmented (free &lt; min)</span>
<span><span class="swatch" style="background:#5a2a7a"></span> Buddy (power-of-2)</span>
</div>
<div id="heap"></div>
<div class="stats">
<div class="stat"><div class="label">Total heap</div><div class="value" id="sTotal">0 B</div></div>
<div class="stat"><div class="label">Allocated</div><div class="value" id="sAlloc">0 B</div></div>
<div class="stat"><div class="label">Free</div><div class="value" id="sFree">0 B</div></div>
<div class="stat"><div class="label">Largest free block</div><div class="value" id="sLargest">0 B</div></div>
<div class="stat"><div class="label">External frag.</div><div class="value" id="sFrag">0%</div></div>
</div>
<div id="log"></div>
<script>
const HEAP_SIZE = 4096;
const MIN_BLOCK = 16;
let blocks = [];
let nextId = 0;

function init() {
  blocks = [{ id: 0, size: HEAP_SIZE, free: true, buddy: false }];
  nextId = 1;
  render();
  log('Heap initialized: ' + HEAP_SIZE + ' bytes');
}

function log(msg) {
  const el = document.getElementById('log');
  el.innerHTML = '<div>' + msg + '</div>' + el.innerHTML;
  if (el.children.length > 30) el.removeChild(el.lastChild);
}

function render() {
  const heap = document.getElementById('heap');
  heap.innerHTML = '';
  let totalAlloc = 0, totalFree = 0, largestFree = 0;
  for (const b of blocks) {
    const div = document.createElement('div');
    div.className = 'block';
    const w = Math.max(20, (b.size / HEAP_SIZE) * 800);
    div.style.width = w + 'px';
    if (b.free) {
      totalFree += b.size;
      if (b.size > largestFree) largestFree = b.size;
      if (b.size < MIN_BLOCK) div.classList.add('fragmented');
      else if (b.buddy) div.classList.add('buddy');
      else div.classList.add('free');
      div.textContent = b.size + 'F';
    } else {
      totalAlloc += b.size;
      div.classList.add('alloc');
      div.textContent = b.size + 'A';
    }
    div.title = (b.free ? 'Free' : 'Allocated') + ' ' + b.size + ' bytes';
    heap.appendChild(div);
  }
  document.getElementById('sTotal').textContent = HEAP_SIZE + ' B';
  document.getElementById('sAlloc').textContent = totalAlloc + ' B';
  document.getElementById('sFree').textContent = totalFree + ' B';
  document.getElementById('sLargest').textContent = largestFree + ' B';
  const frag = totalFree > 0 ? ((totalFree - largestFree) / totalFree * 100).toFixed(1) : '0.0';
  document.getElementById('sFrag').textContent = frag + '%';
}

function coalesce() {
  let changed = true;
  while (changed) {
    changed = false;
    for (let i = 0; i < blocks.length - 1; i++) {
      if (blocks[i].free && blocks[i+1].free) {
        blocks[i].size += blocks[i+1].size;
        blocks.splice(i+1, 1);
        changed = true;
        break;
      }
    }
  }
}

function allocate(size) {
  const algo = document.getElementById('algo').value;
  if (algo === 'buddy') return buddyAlloc(size);
  let idx = -1;
  if (algo === 'firstfit') {
    for (let i = 0; i < blocks.length; i++) {
      if (blocks[i].free && blocks[i].size >= size) { idx = i; break; }
    }
  } else {
    let best = -1, bestSize = Infinity;
    for (let i = 0; i < blocks.length; i++) {
      if (blocks[i].free && blocks[i].size >= size && blocks[i].size < bestSize) {
        best = i; bestSize = blocks[i].size;
      }
    }
    idx = best;
  }
  if (idx === -1) { log('FAIL: no block of ' + size + ' B found'); return; }
  const b = blocks[idx];
  if (b.size > size) {
    blocks.splice(idx, 1, { id: nextId++, size: size, free: false }, { id: nextId++, size: b.size - size, free: true, buddy: false });
  } else {
    b.free = false;
  }
  log('Alloc ' + size + ' B at block ' + idx + ' (' + algo + ')');
  render();
}

function buddyAlloc(size) {
  const needed = Math.pow(2, Math.ceil(Math.log2(size)));
  if (needed > HEAP_SIZE) { log('FAIL: size too large for buddy'); return; }
  // Find a free buddy block of exactly 'needed' size
  let idx = -1;
  for (let i = 0; i < blocks.length; i++) {
    if (blocks[i].free && blocks[i].size === needed) { idx = i; break; }
  }
  if (idx === -1) {
    // Find a larger free block to split
    for (let i = 0; i < blocks.length; i++) {
      if (blocks[i].free && blocks[i].size > needed && blocks[i].size % needed === 0) {
        // Split down to needed
        let cur = i;
        while (blocks[cur].size > needed) {
          const half = blocks[cur].size / 2;
          blocks.splice(cur, 1, { id: nextId++, size: half, free: true, buddy: true }, { id: nextId++, size: half, free: true, buddy: true });
          cur++;
        }
        idx = cur;
        break;
      }
    }
  }
  if (idx === -1) { log('FAIL: no buddy block of ' + needed + ' B'); return; }
  blocks[idx].free = false;
  blocks[idx].buddy = true;
  log('Buddy alloc ' + size + ' B (rounded to ' + needed + ' B)');
  render();
}

function freeBlock() {
  // Free the last allocated block
  for (let i = blocks.length - 1; i >= 0; i--) {
    if (!blocks[i].free) {
      const wasBuddy = blocks[i].buddy;
      blocks[i].free = true;
      if (wasBuddy) {
        // Try to merge with buddy
        buddyMerge(i);
      } else {
        coalesce();
      }
      log('Freed block ' + i);
      render();
      return;
    }
  }
  log('Nothing to free');
}

function buddyMerge(idx) {
  const b = blocks[idx];
  if (!b.free) return;
  const buddySize = b.size;
  // Find buddy: adjacent block of same size that is free
  if (idx > 0 && blocks[idx-1].free && blocks[idx-1].size === buddySize && blocks[idx-1].buddy) {
    blocks.splice(idx-1, 2, { id: nextId++, size: buddySize*2, free: true, buddy: true });
    buddyMerge(idx-1);
  } else if (idx < blocks.length-1 && blocks[idx+1].free && blocks[idx+1].size === buddySize && blocks[idx+1].buddy) {
    blocks.splice(idx, 2, { id: nextId++, size: buddySize*2, free: true, buddy: true });
    buddyMerge(idx);
  }
}

function random10() {
  for (let i = 0; i < 10; i++) {
    const size = 16 * (1 + Math.floor(Math.random() * 15));
    allocate(size);
  }
}

document.getElementById('btnAlloc').onclick = () => {
  const size = parseInt(document.getElementById('size').value) || 64;
  allocate(size);
};
document.getElementById('btnFree').onclick = freeBlock;
document.getElementById('btnRandom').onclick = random10;
document.getElementById('btnReset').onclick = init;

init();
</script>
</body>
</html>
