<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EDM Discharge Cycle</title>
<style>
body { margin: 0; background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; }
h2 { margin: 12px 0 4px; font-size: 16px; }
#info { font-size: 13px; color: #aaa; margin-bottom: 8px; }
#phase { font-size: 14px; color: #4fc3f7; margin-bottom: 6px; height: 20px; }
canvas { border: 1px solid #333; border-radius: 4px; }
.controls { margin-top: 10px; display: flex; gap: 12px; align-items: center; }
button { padding: 6px 14px; background: #263238; color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
button:hover { background: #37474f; }
label { font-size: 12px; color: #aaa; }
input[type=range] { width: 100px; }
</style>
</head>
<body>
<h2>EDM Discharge Cycle Animation</h2>
<div id="info">Voltage build-up → Dielectric breakdown → Plasma discharge → Crater formation → Debris ejection → De-ionisation → Repeat</div>
<div id="phase">Initialising…</div>
<canvas id="c" width="720" height="400"></canvas>
<div class="controls">
<button id="playBtn">⏸ Pause</button>
<label>Speed: <input type="range" id="speed" min="1" max="10" value="3"></label>
<label>Pulse energy: <input type="range" id="energy" min="1" max="10" value="5"></label>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let playing = true;
let speed = 3;
let energy = 5;
let t = 0; // cycle time 0..1

// Phase boundaries (fractions of cycle)
const PHASES = [
  { name: 'Voltage build-up', start: 0, end: 0.30, color: '#4fc3f7' },
  { name: 'Dielectric breakdown', start: 0.30, end: 0.38, color: '#ff9800' },
  { name: 'Plasma discharge', start: 0.38, end: 0.55, color: '#f44336' },
  { name: 'Crater formation & debris ejection', start: 0.55, end: 0.70, color: '#ff5722' },
  { name: 'De-ionisation & flushing', start: 0.70, end: 1.0, color: '#81c784' }
];

function getPhase(t) {
  for (const p of PHASES) {
    if (t >= p.start && t < p.end) return p;
  }
  return PHASES[0];
}

// Voltage waveform
function voltage(t) {
  if (t < 0.30) return 200 * (t / 0.30); // ramp up
  if (t < 0.38) return 200 - 160 * ((t - 0.30) / 0.08); // drop to arc voltage
  if (t < 0.55) return 40 + 10 * Math.sin((t - 0.38) * 80); // arc voltage with ripple
  if (t < 0.70) return 40 * (1 - (t - 0.55) / 0.15); // decay
  return 0; // off
}

// Current waveform
function current(t) {
  if (t < 0.38) return 0;
  if (t < 0.42) return 200 * ((t - 0.38) / 0.04); // rise
  if (t < 0.55) return 200 - 100 * ((t - 0.42) / 0.13); // decay
  if (t < 0.60) return 100 * (1 - (t - 0.55) / 0.05);
  return 0;
}

// Plasma channel radius (0 = none)
function plasmaRadius(t) {
  if (t < 0.30) return 0;
  if (t < 0.38) return 8 * ((t - 0.30) / 0.08);
  if (t < 0.55) return 8 + 25 * ((t - 0.38) / 0.17) * (energy / 5);
  if (t < 0.70) return 33 * (1 - (t - 0.55) / 0.15);
  return 0;
}

// Crater depth
function craterDepth(t) {
  if (t < 0.55) return 0;
  if (t < 0.70) return 12 * ((t - 0.55) / 0.15) * (energy / 5);
  return 12 * (energy / 5);
}

// Debris particles
let debris = [];
function updateDebris(t, dt) {
  const phase = getPhase(t);
  if (phase.name === 'Crater formation & debris ejection') {
    if (Math.random() < 0.4 * speed) {
      const angle = Math.PI * (0.2 + Math.random() * 0.6);
      const spd = 2 + Math.random() * 4;
      debris.push({
        x: W / 2 + (Math.random() - 0.5) * 20,
        y: H / 2 + 30,
        vx: Math.cos(angle) * spd * (Math.random() > 0.5 ? 1 : -1),
        vy: -Math.sin(angle) * spd,
        life: 1
      });
    }
  }
  for (let i = debris.length - 1; i >= 0; i--) {
    debris[i].x += debris[i].vx * dt * speed;
    debris[i].y += debris[i].vy * dt * speed;
    debris[i].vy += 0.1 * dt * speed;
    debris[i].life -= 0.02 * dt * speed;
    if (debris[i].life <= 0) debris.splice(i, 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const phase = getPhase(t);
  document.getElementById('phase').textContent = phase.name;
  document.getElementById('phase').style.color = phase.color;

  // --- Top half: voltage & current waveforms ---
  const waveY = 30, waveH = 100;
  ctx.strokeStyle = '#333';
  ctx.strokeRect(20, waveY, W - 40, waveH);
  ctx.fillStyle = '#666';
  ctx.font = '11px sans-serif';
  ctx.fillText('Voltage (V)', 25, waveY + 12);
  ctx.fillText('Current (A)', 25, waveY + 24);

  // Voltage trace
  ctx.beginPath();
  ctx.strokeStyle = '#4fc3f7';
  ctx.lineWidth = 1.5;
  for (let x = 0; x <= W - 40; x++) {
    const tt = x / (W - 40);
    const v = voltage(tt);
    const y = waveY + waveH - (v / 250) * waveH;
    if (x === 0) ctx.moveTo(20 + x, y); else ctx.lineTo(20 + x, y);
  }
  ctx.stroke();

  // Current trace
  ctx.beginPath();
  ctx.strokeStyle = '#ff9800';
  ctx.lineWidth = 1.5;
  for (let x = 0; x <= W - 40; x++) {
    const tt = x / (W - 40);
    const c = current(tt);
    const y = waveY + waveH - (c / 250) * waveH;
    if (x === 0) ctx.moveTo(20 + x, y); else ctx.lineTo(20 + x, y);
  }
  ctx.stroke();

  // Time cursor
  const cursorX = 20 + t * (W - 40);
  ctx.beginPath();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.moveTo(cursorX, waveY);
  ctx.lineTo(cursorX, waveY + waveH);
  ctx.stroke();
  ctx.setLineDash([]);

  // --- Bottom half: physical scene ---
  const sceneY = 160, sceneH = 220;
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(20, sceneY, W - 40, sceneH);

  // Dielectric fluid (blue tint)
  ctx.fillStyle = 'rgba(30, 80, 140, 0.15)';
  ctx.fillRect(20, sceneY, W - 40, sceneH);

  // Electrode (top)
  const elecY = sceneY + 40;
  ctx.fillStyle = '#8d6e63';
  ctx.fillRect(W / 2 - 40, elecY, 80, 25);
  ctx.fillStyle = '#6d4c41';
  ctx.fillRect(W / 2 - 40, elecY + 25, 80, 5);
  ctx.fillStyle = '#aaa';
  ctx.font = '11px sans-serif';
  ctx.fillText('Electrode', W / 2 - 25, elecY - 5);

  // Workpiece (bottom)
  const wpY = sceneY + sceneH - 60;
  const cd = craterDepth(t);
  ctx.fillStyle = '#546e7a';
  ctx.beginPath();
  ctx.moveTo(20, wpY);
  ctx.lineTo(W / 2 - 30, wpY);
  // Crater
  if (cd > 0) {
    ctx.quadraticCurveTo(W / 2 - 15, wpY + cd, W / 2, wpY + cd);
    ctx.quadraticCurveTo(W / 2 + 15, wpY + cd, W / 2 + 30, wpY);
  } else {
    ctx.lineTo(W / 2 + 30, wpY);
  }
  ctx.lineTo(W - 20, wpY);
  ctx.lineTo(W - 20, sceneY + sceneH);
  ctx.lineTo(20, sceneY + sceneH);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#aaa';
  ctx.fillText('Workpiece', W / 2 - 25, wpY + 45);

  // Gap label
  const gapMid = (elecY + 30 + wpY) / 2;
  ctx.fillStyle = '#666';
  ctx.font = '10px sans-serif';
  ctx.fillText('gap: 20–100 µm', W / 2 + 50, gapMid);

  // Plasma channel
  const pr = plasmaRadius(t);
  if (pr > 0) {
    const px = W / 2, py = (elecY + 30 + wpY) / 2;
    const grad = ctx.createRadialGradient(px, py, 0, px, py, pr);
    grad.addColorStop(0, 'rgba(255, 255, 200, 0.9)');
    grad.addColorStop(0.3, 'rgba(255, 150, 0, 0.7)');
    grad.addColorStop(0.7, 'rgba(255, 50, 0, 0.4)');
    grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, Math.PI * 2);
    ctx.fill();

    // Plasma channel line
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255, 255, 200, 0.8)';
    ctx.lineWidth = 2;
    ctx.moveTo(px, elecY + 30);
    ctx.lineTo(px, wpY);
    ctx.stroke();
  }

  // Debris particles
  for (const d of debris) {
    ctx.fillStyle = `rgba(255, 180, 50, ${d.life})`;
    ctx.beginPath();
    ctx.arc(d.x, d.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Phase indicator bar
  const barY = sceneY + sceneH + 5;
  for (const p of PHASES) {
    const x1 = 20 + p.start * (W - 40);
    const x2 = 20 + p.end * (W - 40);
    ctx.fillStyle = p.color + '44';
    ctx.fillRect(x1, barY, x2 - x1, 8);
    if (t >= p.start && t < p.end) {
      ctx.fillStyle = p.color;
      ctx.fillRect(x1, barY, x2 - x1, 8);
    }
  }
}

let lastTime = 0;
function animate(ts) {
  if (!lastTime) lastTime = ts;
  const dt = (ts - lastTime) / 1000;
  lastTime = ts;

  if (playing) {
    t += dt * 0.3 * speed;
    if (t >= 1) { t -= 1; debris = []; }
    updateDebris(t, dt);
  }

  draw();
  requestAnimationFrame(animate);
}

document.getElementById('playBtn').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? '⏸ Pause' : '▶ Play';
});
document.getElementById('speed').addEventListener('input', (e) => { speed = +e.target.value; });
document.getElementById('energy').addEventListener('input', (e) => { energy = +e.target.value; });

requestAnimationFrame(animate);
</script>
</body>
</html>
