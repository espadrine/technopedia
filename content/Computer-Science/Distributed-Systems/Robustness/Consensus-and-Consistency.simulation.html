<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Raft Leader Election</title>
<style>
body { font-family: sans-serif; margin: 20px; background: #1a1a2e; color: #eee; }
h2 { text-align: center; color: #fff; }
.controls { text-align: center; margin: 15px 0; }
button { padding: 8px 16px; margin: 0 5px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
#startBtn { background: #4caf50; color: white; }
#resetBtn { background: #607d8b; color: white; }
#speedBtn { background: #ff9800; color: white; }
#status { text-align: center; font-size: 16px; margin: 10px 0; min-height: 24px; color: #ffeb3b; }
.nodes { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
.node { width: 80px; height: 80px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 3px solid #555; background: #2d2d44; transition: all 0.3s; }
.node.follower { border-color: #2196f3; }
.node.candidate { border-color: #ff9800; background: #3d3020; }
.node.leader { border-color: #4caf50; background: #1b3d2a; }
.node.crashed { border-color: #f44336; background: #3d1a1a; opacity: 0.5; }
.node .label { font-size: 18px; font-weight: bold; }
.node .role { font-size: 10px; margin-top: 4px; }
.node .term { font-size: 10px; color: #aaa; }
.node .votes { font-size: 10px; color: #ffeb3b; }
#log { margin: 15px auto; max-width: 600px; max-height: 150px; overflow-y: auto; background: #111; padding: 10px; border-radius: 4px; font-size: 12px; font-family: monospace; }
#log div { margin: 2px 0; }
#log .info { color: #90caf9; }
#log .warn { color: #ffcc80; }
#log .success { color: #a5d6a7; }
#log .error { color: #ef9a9a; }
</style>
</head>
<body>
<h2>Raft Leader Election</h2>
<div class="controls">
<button id="startBtn">Start Election</button>
<button id="resetBtn">Reset</button>
<button id="speedBtn">Speed: 1x</button>
</div>
<div id="status">5-node cluster. Node A is leader (term 1). Click "Start Election" to crash A and trigger a new election.</div>
<div class="nodes" id="nodes"></div>
<div id="log"></div>
<script>
const nodes = [
  { id: 'A', role: 'leader', term: 1, votes: 0, crashed: false },
  { id: 'B', role: 'follower', term: 1, votes: 0, crashed: false },
  { id: 'C', role: 'follower', term: 1, votes: 0, crashed: false },
  { id: 'D', role: 'follower', term: 1, votes: 0, crashed: false },
  { id: 'E', role: 'follower', term: 1, votes: 0, crashed: false }
];
let speed = 1;
let running = false;

function render() {
  const container = document.getElementById('nodes');
  container.innerHTML = '';
  nodes.forEach(n => {
    const div = document.createElement('div');
    div.className = 'node ' + (n.crashed ? 'crashed' : n.role);
    div.innerHTML = `<span class="label">${n.id}</span><span class="role">${n.crashed ? 'CRASHED' : n.role.toUpperCase()}</span><span class="term">term ${n.term}</span>${n.votes > 0 ? `<span class="votes">votes: ${n.votes}</span>` : ''}`;
    container.appendChild(div);
  });
}

function log(msg, cls) {
  const el = document.getElementById('log');
  const div = document.createElement('div');
  div.className = cls || 'info';
  div.textContent = msg;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms / speed));
}

async function runElection() {
  if (running) return;
  running = true;
  document.getElementById('startBtn').disabled = true;

  // Crash node A
  nodes[0].crashed = true;
  nodes[0].role = 'follower';
  render();
  log('Node A crashes. Followers B, C, D, E stop receiving heartbeats.', 'error');
  setStatus('Node A crashed. Waiting for election timeouts...');
  await sleep(1500);

  // B times out first
  nodes[1].role = 'candidate';
  nodes[1].term = 2;
  render();
  log('B\'s election timeout fires. B becomes candidate (term 2).', 'warn');
  setStatus('B is a candidate (term 2). Requesting votes...');
  await sleep(1000);

  // B votes for itself
  nodes[1].votes = 1;
  render();
  log('B votes for itself. Votes: 1/3 (quorum needed).', 'info');
  await sleep(800);

  // C votes for B
  nodes[1].votes = 2;
  render();
  log('C grants vote to B (term 2 > C\'s term 1). Votes: 2/3.', 'info');
  await sleep(800);

  // D votes for B
  nodes[1].votes = 3;
  render();
  log('D grants vote to B. Votes: 3/3 = QUORUM!', 'success');
  setStatus('B has a quorum! B becomes leader (term 2).');
  await sleep(800);

  // B becomes leader
  nodes[1].role = 'leader';
  nodes[1].votes = 0;
  render();
  log('B is the new leader (term 2). Sending heartbeats to C, D, E.', 'success');
  setStatus('B is leader (term 2). Cluster is stable.');
  await sleep(1000);

  // E votes for B (late)
  nodes[1].votes = 4;
  render();
  log('E grants vote to B (late). B has 4/5 votes. All nodes follow B.', 'info');
  await sleep(800);

  // E becomes follower
  nodes[4].role = 'follower';
  nodes[4].term = 2;
  render();
  log('E accepts B as leader. All 4 alive nodes are in sync.', 'success');
  setStatus('Election complete. B is leader (term 2). 4/5 nodes alive, quorum (3) maintained.');

  running = false;
  document.getElementById('startBtn').disabled = false;
}

function reset() {
  nodes.forEach(n => { n.role = 'follower'; n.term = 1; n.votes = 0; n.crashed = false; });
  nodes[0].role = 'leader';
  document.getElementById('log').innerHTML = '';
  setStatus('5-node cluster. Node A is leader (term 1). Click "Start Election" to crash A and trigger a new election.');
  render();
}

document.getElementById('startBtn').onclick = runElection;
document.getElementById('resetBtn').onclick = reset;
document.getElementById('speedBtn').onclick = function() {
  speed = speed === 1 ? 2 : speed === 2 ? 4 : 1;
  this.textContent = 'Speed: ' + speed + 'x';
};

render();
</script>
</body>
</html>
