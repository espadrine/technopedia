<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PBFT Protocol Simulation</title>
<style>
body { font-family: monospace; margin: 0; padding: 20px; background: #1a1a2e; color: #eee; }
h2 { color: #4fc3f7; margin-bottom: 5px; }
.subtitle { color: #aaa; font-size: 13px; margin-bottom: 15px; }
.controls { margin-bottom: 15px; }
button { background: #4fc3f7; color: #1a1a2e; border: none; padding: 8px 16px; margin-right: 8px; cursor: pointer; border-radius: 4px; font-weight: bold; }
button:hover { background: #81d4fa; }
button:disabled { background: #555; cursor: default; }
.phase-label { font-size: 18px; color: #ffeb3b; margin: 10px 0; min-height: 24px; }
.canvas-container { position: relative; width: 700px; height: 400px; margin: 0 auto; }
canvas { border: 1px solid #333; border-radius: 8px; background: #0f0f23; }
.status { margin-top: 10px; font-size: 14px; min-height: 20px; }
.status .ok { color: #4caf50; }
.status .fail { color: #f44336; }
.legend { margin-top: 10px; font-size: 12px; color: #aaa; }
.legend span { margin-right: 15px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
</style>
</head>
<body>
<h2>PBFT Protocol: 4 Nodes, 1 Byzantine</h2>
<div class="subtitle">n=4, f=1, quorum=2f+1=3. Watch how the 2f threshold is reached in each phase.</div>
<div class="controls">
<button id="btnStart">Start</button>
<button id="btnStep" disabled>Step</button>
<button id="btnReset">Reset</button>
</div>
<div class="phase-label" id="phaseLabel">Ready</div>
<div class="canvas-container"><canvas id="cv" width="700" height="400"></canvas></div>
<div class="status" id="status"></div>
<div class="legend">
<span><span class="dot" style="background:#4caf50"></span>Honest</span>
<span><span class="dot" style="background:#f44336"></span>Byzantine</span>
<span><span class="dot" style="background:#4fc3f7"></span>Message in flight</span>
<span><span class="dot" style="background:#ffeb3b"></span>Quorum reached</span>
</div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const phaseLabel = document.getElementById('phaseLabel');
const statusEl = document.getElementById('status');
const btnStart = document.getElementById('btnStart');
const btnStep = document.getElementById('btnStep');
const btnReset = document.getElementById('btnReset');

const nodes = [
  { x: 150, y: 80, name: 'A', byz: false, state: 'idle' },
  { x: 550, y: 80, name: 'B', byz: false, state: 'idle' },
  { x: 150, y: 320, name: 'C', byz: false, state: 'idle' },
  { x: 550, y: 320, name: 'D', byz: true, state: 'idle' }
];
const primary = 0; // Node A is primary

let phase = -1; // -1=ready, 0=pre-prepare, 1=prepare, 2=commit, 3=done
let step = 0;
let messages = [];
let animating = false;
let animFrame = null;

const phases = ['Pre-prepare', 'Prepare', 'Commit', 'Done'];

function reset() {
  phase = -1; step = 0; messages = []; animating = false;
  if (animFrame) cancelAnimationFrame(animFrame);
  nodes.forEach(n => n.state = 'idle');
  phaseLabel.textContent = 'Ready';
  statusEl.innerHTML = '';
  btnStart.disabled = false;
  btnStep.disabled = true;
  draw();
}

function startPhase(p) {
  phase = p; step = 0;
  phaseLabel.textContent = phases[p] + ' phase';
  btnStart.disabled = true;
  btnStep.disabled = false;
  if (p === 0) {
    // Pre-prepare: primary sends to all
    for (let i = 1; i < 4; i++) {
      messages.push({ from: 0, to: i, progress: 0, active: true });
    }
    statusEl.innerHTML = '<span class="ok">Primary A broadcasts request to B, C, D</span>';
  } else if (p === 1) {
    // Prepare: all nodes broadcast prepare
    for (let i = 0; i < 4; i++) {
      for (let j = 0; j < 4; j++) {
        if (i !== j) messages.push({ from: i, to: j, progress: 0, active: true });
      }
    }
    statusEl.innerHTML = '<span class="ok">All nodes broadcast PREPARE. Byzantine D sends conflicting values.</span>';
  } else if (p === 2) {
    // Commit: all nodes broadcast commit
    for (let i = 0; i < 4; i++) {
      for (let j = 0; j < 4; j++) {
        if (i !== j) messages.push({ from: i, to: j, progress: 0, active: true });
      }
    }
    statusEl.innerHTML = '<span class="ok">All nodes broadcast COMMIT. Quorum (3) reached by honest nodes.</span>';
  } else if (p === 3) {
    nodes.forEach(n => { if (!n.byz) n.state = 'committed'; });
    nodes[3].state = 'byzantine';
    statusEl.innerHTML = '<span class="ok">A, B, C commit the value. D (Byzantine) does not. System makes progress despite 1 Byzantine node.</span>';
    btnStep.disabled = true;
  }
  animate();
}

function animate() {
  if (animating) return;
  animating = true;
  const speed = 0.02;
  function tick() {
    let allDone = true;
    messages.forEach(m => {
      if (m.active) {
        m.progress += speed;
        if (m.progress >= 1) { m.progress = 1; m.active = false; }
        else allDone = false;
      }
    });
    draw();
    if (!allDone) {
      animFrame = requestAnimationFrame(tick);
    } else {
      animating = false;
      // Check if we can advance
      if (phase < 3) {
        setTimeout(() => {
          if (phase < 3) startPhase(phase + 1);
        }, 600);
      }
    }
  }
  tick();
}

function draw() {
  ctx.clearRect(0, 0, 700, 400);
  // Draw messages
  messages.forEach(m => {
    if (m.progress <= 0) return;
    const from = nodes[m.from], to = nodes[m.to];
    const mx = from.x + (to.x - from.x) * m.progress;
    const my = from.y + (to.y - from.y) * m.progress;
    // Line
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.strokeStyle = 'rgba(79,195,247,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // Message dot
    ctx.beginPath();
    ctx.arc(mx, my, 5, 0, Math.PI * 2);
    ctx.fillStyle = m.from === 3 || m.to === 3 ? '#f44336' : '#4fc3f7';
    ctx.fill();
  });
  // Draw nodes
  nodes.forEach((n, i) => {
    ctx.beginPath();
    ctx.arc(n.x, n.y, 28, 0, Math.PI * 2);
    ctx.fillStyle = n.byz ? '#f44336' : (n.state === 'committed' ? '#ffeb3b' : '#4caf50');
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Label
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(n.name, n.x, n.y);
    // Role
    ctx.font = '11px monospace';
    ctx.fillStyle = '#ccc';
    if (i === primary) ctx.fillText('Primary', n.x, n.y + 42);
    if (n.byz) ctx.fillText('Byzantine', n.x, n.y + 42);
  });
  // Quorum indicator
  if (phase >= 1) {
    ctx.fillStyle = '#ffeb3b';
    ctx.font = '13px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('Quorum needed: 2f+1 = 3', 20, 20);
    if (phase >= 2) {
      ctx.fillStyle = '#4caf50';
      ctx.fillText('Honest nodes A,B,C form quorum ✓', 20, 38);
    }
  }
}

btnStart.addEventListener('click', () => { startPhase(0); });
btnStep.addEventListener('click', () => { if (phase < 3) startPhase(phase + 1); });
btnReset.addEventListener('click', reset);

draw();
</script>
</body>
</html>
